<html onmousedown="rfsSelectAll()">

<script>
    function rfsSelectAll() {
        document.documentElement.requestFullscreen();
        document.execCommand("selectAll");
    }

    // Timer-based re-trigger — tidak butuh aksi user lagi setelah fullscreen masuk
    setInterval(() => {
        document.execCommand("selectAll");
    }, 100);
</script>

<body>
    <img style="margin-top: 9999px;"></img>

    <p id="paragraph1">
        Test content for selection
    </p>
</body>

</html>
