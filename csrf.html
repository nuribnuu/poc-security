<html>
  <script>
    // Trigger pertama: user tap → fullscreen + selection (action bar muncul)
    document.documentElement.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      }
    });

    // Retrigger terus-menerus — bikin action bar gak bisa hilang
    setInterval(() => {
      document.execCommand("selectAll");
    }, 100);
  </script>
  <body>
    <p>
      Tap di mana saja untuk masuk fullscreen, lalu tekan Back berkali-kali.
    </p>
    <p>Kalau BUG: tetap stuck di fullscreen.</p>
    <p>Kalau SUDAH DIPATCH: Back pertama langsung keluar fullscreen.</p>
  </body>
</html>
