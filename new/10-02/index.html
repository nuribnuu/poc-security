<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>www.google.com</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: system-ui, sans-serif;
      }

      button {
        font-size: 20px;
        padding: 16px 32px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      /* overlay */
      #overlay {
        position: fixed;
        inset: 0;
        background: #f5f5f5;
        display: none;
        justify-content: center;
        align-items: center;
      }

      /* fake login card */
      .login-box {
        background: #fff;
        width: 340px;
        padding: 32px;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        text-align: center;
      }

      .login-box h2 {
        margin: 0 0 6px 0;
        font-weight: 500;
      }

      .login-box p {
        margin: 0 0 24px 0;
        font-size: 14px;
        color: #666;
      }

      .login-box input {
        width: 100%;
        padding: 12px;
        margin-bottom: 12px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 14px;
      }

      .login-box .login-btn {
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        border: none;
        background: #1a73e8;
        color: #fff;
        font-size: 15px;
        cursor: pointer;
      }

      .note {
        margin-top: 14px;
        font-size: 11px;
        color: #999;
      }
    </style>
  </head>
  <body>
    <button id="go">Login With Google</button>

    <div id="overlay">
      <div class="login-box">
        <h2>Sign in</h2>
        <p>Use your account to continue</p>

        <input type="email" placeholder="Email or username" />
        <input type="password" placeholder="Password" />

        <button class="login-btn">Login</button>

        <div class="note">Demo interface Â· Research / PoC only</div>
      </div>
    </div>

    <script>
      const overlay = document.getElementById("overlay");

      document.getElementById("go").addEventListener("click", async () => {
        try {
          if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
          }
        } catch (e) {}

        overlay.style.display = "flex";
      });

      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement) {
          overlay.style.display = "none";
        }
      });
    </script>
  </body>
</html>
